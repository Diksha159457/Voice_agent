name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=. --cov-report=term-missing
      - name: App boots without an API key
        run: |
          gunicorn app:app --bind 127.0.0.1:8000 --daemon
          sleep 3
          curl -fs 127.0.0.1:8000/health
          curl -fs 127.0.0.1:8000/ | grep -q "Voice Agent"
